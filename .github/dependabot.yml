# Weekly version updates. Minor and patch bumps arrive as one PR per area; a major bump gets its own
# PR so it can be checked on its own. Security fixes are separate and arrive as soon as they exist.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ai-service
    schedule:
      interval: weekly
    groups:
      ai-service:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
